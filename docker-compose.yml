version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_NAME=zhd_onboarding
      - DB_USER=root
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - JWT_SECRET=6bbc42ce496b8e849ce64d69536036b6cd1b2706278fe3ee7cdba5202421cee5df3a54476883664f5a3b6ef1301ca04fe6cf01db8fd56dce1a221d3ae435e971
    depends_on:
      - mysql
      - redis
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - zhd-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=__Piquii.365
      - MYSQL_DATABASE=project_power
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - zhd-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - zhd-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - zhd-network

volumes:
  mysql_data:
  redis_data:

networks:
  zhd-network:
    driver: bridge