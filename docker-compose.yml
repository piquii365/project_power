version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=onboarding
      - DB_USER=root
      - DB_PASSWORD=Piquii.365
      - REDIS_HOST=redis
      - REDIS_PORT=6379  # Internal container port remains 6379
      - JWT_SECRET=6bbc42ce496b8e849ce64d69536036b6cd1b2706278fe3ee7cdba5202421cee5df3a54476883664f5a3b6ef1301ca04fe6cf01db8fd56dce1a221d3ae435e971
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - zhd-network

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=Piquii.365
      - MYSQL_DATABASE=onboarding
    ports:
      - "3307:3306"  # Host:3307 → Container:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks:
      - zhd-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Host:6380 → Container:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - zhd-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - zhd-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  zhd-network:
    driver: bridge