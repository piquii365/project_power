version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=onboarding
      - DB_USER=root
      - DB_PASSWORD=Piquii.365
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=6bbc42ce496b8e849ce64d69536036b6cd1b2706278fe3ee7cdba5202421cee5df3a54476883664f5a3b6ef1301ca04fe6cf01db8fd56dce1a221d3ae435e971
      # AI Training Configuration
      - SKIP_AI_TRAINING=false  # Set to true to skip AI training
      - AI_TRAINING_TIMEOUT=600  # 10 minutes timeout for training
      - MODEL_VALIDATION_TIMEOUT=300  # 5 minutes timeout for validation
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./models:/app/models  # Persist trained models
      - ./logs:/app/logs      # Persist logs
    restart: unless-stopped
    networks:
      - zhd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M
    environment:
      - MYSQL_ROOT_PASSWORD=Piquii.365
      - MYSQL_DATABASE=onboarding
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql-config:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - zhd-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - zhd-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - zhd-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  zhd-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16